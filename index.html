<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halliday SDK + RainbowKit Example</title>
    <style>
      html,
      body {
        margin: 0px;
        padding: 0px;
        font-family: Arial;
      }

      .halliday-container {
        margin: auto;
        width: max-content;
      }

      button {
        display: block;
        margin: 50px auto;
        background-color: #3df57b;
        color: #1a1a1a;
        border: none;
        border-radius: 5px;
        padding: 16px 29px;
        cursor: pointer;
        font-size: 17px;
        font-weight: bold;
      }

      button:hover {
        background-color: #55f68b;
      }

      button:disabled {
        background-color: #c5c9c6;
        color: #8a8a8a;
        cursor: not-allowed;
      }

      button:disabled:hover {
        background-color: #c5c9c6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
